packages:
  - "apps/*"
  - "packages/*"

# Unify ioredis so BullMQ and our direct deps share one copy (avoids type-identity clash).
overrides:
  ioredis: "5.11.0"

# Approve build scripts for native modules (required by NestJS and argon2)
allowBuilds:
  '@nestjs/core': true
  argon2: true
  esbuild: true
  msgpackr-extract: true
  sharp: false
